name: Shadow Studio cloud video rendering test
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    defaults:
      run:
        working-directory: src/shadow-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/shadow-studio/requirements.txt
      - name: Install FFmpeg
        run: bash ../../.github/scripts/setup-test-ffmpeg.sh
      - name: Install offline renderer dependencies
        run: python -m pip install --timeout 25 --retries 2 -r requirements.txt
      - name: Generate and verify synthetic Shorts locally on GitHub runner
        run: python production_smoke_test.py
      # Deliberately no Google credentials, video upload, schedules or public publishing.
