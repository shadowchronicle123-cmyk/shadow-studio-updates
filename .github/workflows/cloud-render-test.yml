name: Shadow Studio cloud video rendering test
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cloud-render-test.yml'
      - 'src/shadow-studio/production_smoke_test.py'
      - 'src/shadow-studio/private_upload_test.py'
      - 'src/shadow-studio/authorize_youtube_web_test.py'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    defaults:
      run:
        working-directory: src/shadow-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/shadow-studio/requirements.txt
      - name: Install FFmpeg
        run: bash ../../.github/scripts/setup-test-ffmpeg.sh
      - name: Install offline renderer dependencies
        run: python -m pip install --timeout 25 --retries 2 -r requirements.txt
      - name: Generate and verify synthetic Shorts locally on GitHub runner
        run: python production_smoke_test.py
      - name: Verify full daily 1080p production worker and private upload handoff offline
        run: python production_worker_test.py
      - name: Verify private-only upload guards using mocked YouTube transport
        run: python private_upload_test.py
      - name: Verify OAuth callback security offline
        run: python authorize_youtube_web_test.py
      # Deliberately no Google credentials, video upload, schedules or public publishing.
