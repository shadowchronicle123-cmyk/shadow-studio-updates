name: Shadow Studio cloud automation preflight
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'netlify.toml'
      - 'netlify-site/**'
      - 'docs/NETLIFY_OAUTH_HANDOFF.md'
      - 'scripts/cloud_preflight.py'
      - '.github/workflows/cloud-automation-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate safe cloud deployment configuration
        run: python scripts/cloud_preflight.py
