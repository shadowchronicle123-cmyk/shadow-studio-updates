name: Word captions offline QA
on:
  push:
    branches: [feature/streamer-word-captions-plan]
  pull_request:
    paths:
      - 'src/shadow-studio/word_captions.py'
      - 'src/shadow-studio/word_captions_test.py'
      - 'src/shadow-studio/word_captions_ass.py'
      - 'src/shadow-studio/word_captions_ass_test.py'
      - '.github/workflows/word-captions-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  captions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate caption timing and safe placement
        working-directory: src/shadow-studio
        run: |
          python word_captions_test.py
          python word_captions_ass_test.py
