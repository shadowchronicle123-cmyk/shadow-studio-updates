name: Build and publish Shadow Studio from source
on:
  workflow_dispatch:
    inputs:
      approved:
        description: Confirm the owner explicitly approved this operation
        type: boolean
        required: true
        default: false
      sha256:
        description: SHA-256 of the exact approved candidate ZIP
        type: string
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: shadow-studio-release
  cancel-in-progress: false

jobs:
  windows-smoke:
    if: github.ref == 'refs/heads/main' && inputs.approved
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/shadow-studio/requirements.txt
      - name: Install FFmpeg when missing
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Test Windows endpoints and rendering
        working-directory: src/shadow-studio
        shell: bash
        run: |
          python -m pip install -r requirements.txt
          python self_test.py
          python production_smoke_test.py
          python audio_mix_test.py
          python update_manager_test.py
          python story_expansion_test.py
          python conversation_test.py
          python cloud_handoff_test.py
          python migration_acceptance_test.py
          python windows_voice_test.py

  build:
    needs: windows-smoke
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.package.outputs.publish }}
      version: ${{ steps.package.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/shadow-studio/requirements.txt
      - name: Install export test dependencies
        timeout-minutes: 4
        run: |
          bash .github/scripts/setup-test-ffmpeg.sh
          python -m pip install --disable-pip-version-check --timeout 20 --retries 2 packaging -r src/shadow-studio/requirements.txt
      - name: Run offline release tests
        working-directory: src/shadow-studio
        run: |
          python self_test.py
          python integration_test.py
          python production_smoke_test.py
          python audio_mix_test.py
          python update_manager_test.py
          python story_expansion_test.py
          python conversation_test.py
          python cloud_handoff_test.py
          python migration_acceptance_test.py
          python integration_acceptance_v027.py
          python batch_render_test.py
      - name: Test, package, and verify release
        id: package
        shell: bash
        env:
          APPROVED_SHA256: ${{ inputs.sha256 }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, py_compile, re, subprocess, sys, zipfile
          from packaging.version import Version
          root = pathlib.Path("src/shadow-studio")
          docs = pathlib.Path("docs")
          if not root.is_dir():
              sys.exit("Shadow Studio source folder not found")
          for required in ("app.py", "update_manager.py", "requirements.txt", "renderer.py"):
              if not (root / required).is_file():
                  sys.exit("Missing: " + required)
          for p in root.rglob("*.py"):
              py_compile.compile(str(p), cfile="/tmp/shadow-check.pyc", doraise=True)
          manager = (root / "update_manager.py").read_text()
          match = re.search(r"(?m)^VERSION\s*=\s*['\"](\d+\.\d+\.\d+)['\"]", manager)
          if not match:
              sys.exit("Release version missing from update_manager.py")
          version = match.group(1)
          manifest_path = docs / "latest.json"
          old = json.loads(manifest_path.read_text()) if manifest_path.is_file() else {}
          old_ver = old.get("version", "0.0.0")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("version=" + version + "\n")
          if Version(version) <= Version(old_ver):
              print("No newer release: source", version, "live", old_ver)
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("publish=false\\n".replace("\\n", "\n"))
              sys.exit(0)
          archive_path = pathlib.Path("/tmp/shadow-studio-v" + version + "-source.zip")
          sys.path.insert(0, str(root))
          from migration_acceptance_test import package
          archive_path.write_bytes(package())
          with zipfile.ZipFile(archive_path) as z:
              if z.testzip() or "shadow-studio/app.py" not in z.namelist():
                  sys.exit("Built archive failed integrity check")
          digest = hashlib.sha256(archive_path.read_bytes()).hexdigest()
          if digest != os.environ["APPROVED_SHA256"].strip().lower():
              sys.exit("The built ZIP differs from the approved candidate")
          print("Built", archive_path, "sha256", digest)
          filename = archive_path.name
          destination = docs / filename
          destination.write_bytes(archive_path.read_bytes())
          manifest = {
              "version": version,
              "url": "https://shadowchronicle123-cmyk.github.io/shadow-studio-updates/" + filename,
              "sha256": digest,
          }
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("publish=true\n")
              out.write("sha256=" + digest + "\n")
          PY
      - name: Commit verified ZIP and manifest
        if: steps.package.outputs.publish == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/latest.json "docs/shadow-studio-v${{ steps.package.outputs.version }}-source.zip"
          git commit -m "Release Shadow Studio v${{ steps.package.outputs.version }}"
          git push
      - name: Upload GitHub Pages files
        if: steps.package.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified update feed
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public ZIP and publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          filename="shadow-studio-v${RELEASE_VERSION}-source.zip"
          base="https://shadowchronicle123-cmyk.github.io/shadow-studio-updates"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 4 "$base/$filename" -o "$filename"
          printf '%s  %s\n' "$RELEASE_SHA256" "$filename" | tee "$filename.sha256"
          sha256sum --check "$filename.sha256"
          unzip -tq "$filename"
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$tag" "$filename" "$filename.sha256" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Shadow Studio $tag" \
            --notes "Verified Windows application package. See the included release notes for full changes."
