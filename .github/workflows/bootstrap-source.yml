name: Import verified Shadow Studio source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore verified v0.29 source into repository
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, io, pathlib, urllib.request, zipfile, sys
          url = "https://raw.githubusercontent.com/shadowchronicle123-cmyk/shadow-studio-updates/main/docs/shadow-studio-v0.29-dual-voice-elevenlabs-updater.zip"
          expected = "c0cda85cde52ec46a353a501e4050f58e3af314d9cd8be901b89eaf191c9b148"
          with urllib.request.urlopen(url, timeout=60) as response:
              data = response.read(12_000_000)
          digest = hashlib.sha256(data).hexdigest()
          if digest != expected:
              sys.exit("Release archive checksum mismatch: " + digest)
          root = pathlib.Path("src/shadow-studio")
          root.mkdir(parents=True, exist_ok=True)
          blocked = {".env", ".venv", "__pycache__", "outputs", "projects", "uploads", "gameplay", "clips", "backups", "media"}
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              if archive.testzip():
                  sys.exit("Corrupt release archive")
              for item in archive.infolist():
                  p = pathlib.PurePosixPath(item.filename)
                  if item.is_dir() or not p.parts or p.parts[0] != "shadow-studio":
                      continue
                  rel = p.parts[1:]
                  if not rel or any(x in blocked for x in rel):
                      continue
                  target = root.joinpath(*rel)
                  if target.resolve().is_relative_to(root.resolve()) is False:
                      sys.exit("Unsafe path")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(item))
          if not (root / "app.py").is_file() or not (root / "update_manager.py").is_file():
              sys.exit("Required application sources absent")
          print("Imported verified v0.29 into src/shadow-studio")
          PY
      - name: Save source for future automatic releases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shadow-studio
          if git diff --cached --quiet; then
            echo "Source already present"
            exit 0
          fi
          git commit -m "Bootstrap Shadow Studio source from verified v0.29"
          git push
